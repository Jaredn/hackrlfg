# Pushing a tag like v1.0.1 builds the addon zip with the BigWigs packager,
# uploads it to CurseForge (game version read from the .toc: 16001 = WoW
# Forever) and attaches it to a GitHub release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
